<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>TAKI VS ESTUDIO v7</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<meta name="theme-color" content="#d4af37">
<style>
:root{--gold:#d4af37;--bg:#000;--card:#111;--text:#f5e6a8;--red:#ff3b30;--green:#34c759}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui}
body{background:var(--bg);color:var(--text);padding:0;padding-bottom:90px}
.header{border-bottom:2px solid var(--gold);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#1a1a1a,#000);position:sticky;top:0;z-index:50}
.header h1{color:var(--gold);letter-spacing:1.5px;font-size:18px;font-weight:900}
.hamburger{width:42px;height:42px;border:1.5px solid var(--gold);background:#000;color:var(--gold);border-radius:10px;font-size:20px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn{border:1.5px solid var(--gold);background:#111;color:var(--gold);padding:10px 14px;border-radius:22px;font-weight:900;cursor:pointer;font-size:11px}
.btn.active{background:var(--gold);color:#000}
.btn.gold{background:var(--gold);color:#000;box-shadow:0 0 12px rgba(212,175,55,0.4)}
.install-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(#1a1a1a,#000);border-top:2px solid var(--gold);padding:10px 12px;display:flex;gap:8px;z-index:100}
.install-bar button{flex:1;padding:13px;border-radius:25px;font-weight:900;font-size:12px;cursor:pointer;border:none}
#installBtn{background:var(--gold);color:#000}
#shareBtn{background:#111;color:var(--gold);border:1.5px solid var(--gold)}
.main{padding:12px}
.card{border:1.5px solid var(--gold);border-radius:14px;padding:12px;margin:10px 0;background:var(--card)}
.card.save{border:2.5px solid var(--green);box-shadow:0 0 20px rgba(52,199,87,0.25)}
textarea{width:100%;height:100px;background:#000;color:var(--gold);border:1px solid var(--gold);padding:10px;border-radius:10px;font-size:13px}
input[type=text]{width:100%;background:#000;color:var(--gold);border:1.5px solid var(--gold);padding:12px;border-radius:10px;font-size:14px;font-weight:700}
.file-label{border:2px dashed var(--gold);padding:14px;border-radius:25px;display:block;text-align:center;cursor:pointer;background:linear-gradient(#1a1a1a,#000);color:var(--gold);font-weight:900;font-size:13px}
#telaGrande{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;overflow-y:auto}
.tela-header{position:sticky;top:0;background:#000;border-bottom:2px solid var(--gold);padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.tela-content{padding:10px 16px 120px 16px}
.tela-cifra{color:var(--gold);font-weight:900;font-size:22px;background:rgba(212,175,55,0.15);padding:8px 12px;border-radius:8px;display:inline-block;margin:20px 0 6px 0;border-left:4px solid var(--gold)}
.tela-letra{color:#fff;font-size:30px;font-weight:800;text-transform:uppercase;margin-bottom:10px;line-height:1.25}
.parte-label{background:rgba(212,175,55,0.25);color:var(--gold);padding:6px 14px;border-radius:20px;font-weight:900;font-size:14px;display:inline-block;margin:22px 0 6px 0}
#menuOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:80}
#menuPanel{background:#0a0a0a;border-right:2px solid var(--gold);width:85%;max-width:320px;height:100%;padding:16px}
.menu-item{display:block;width:100%;text-align:left;background:#111;border:1.2px solid var(--gold);color:var(--gold);padding:12px 14px;border-radius:12px;margin:6px 0;font-weight:700;font-size:13px;cursor:pointer}
.menu-item.active{background:var(--gold);color:#000}
.menu-item.gold{background:var(--gold);color:#000}
.view{display:none}.view.active{display:block}
.repertorio-item{background:#000;border:1.5px solid var(--gold);border-radius:10px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.repertorio-title{color:var(--gold);font-weight:900;font-size:13px}
.repertorio-meta{color:#aaa;font-size:10px;margin-top:2px}
.small{border:1.2px solid var(--gold);background:#000;color:var(--gold);padding:7px 12px;border-radius:20px;font-size:11px;cursor:pointer;font-weight:700}
.small.green{border-color:var(--green);color:var(--green)}.small.red{border-color:#ff3b30;color:#ff3b30}
.cifra-line{color:var(--gold);font-weight:900;font-size:15px;background:rgba(212,175,55,0.12);display:inline-block;padding:2px 8px;border-radius:6px}
.letra-line{color:#fff8cc;font-size:18px;font-weight:700;text-transform:uppercase}
.drum-kit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pad{border:2px solid var(--gold);background:linear-gradient(145deg,#1a1a1a,#000);color:var(--gold);padding:18px 6px;border-radius:12px;font-weight:900;font-size:12px;cursor:pointer;text-align:center}
.bpm-box{background:#000;border:1.5px solid var(--gold);border-radius:10px;padding:10px;margin-top:10px}
.bpm-display{font-size:34px;font-weight:900;color:var(--gold);text-align:center}
.pitch-display{font-size:28px;font-weight:900;color:#aaffaa;text-align:center}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;align-items:center;gap:10px"><button class="hamburger" onclick="toggleMenu()">☰</button><h1>TAKI VS v7</h1></div>
  <button class="btn gold" onclick="toggleTela()">⛶ TELA CHEIA</button>
</div>
<div id="menuOverlay" onclick="if(event.target.id==='menuOverlay') toggleMenu()">
  <div id="menuPanel">
    <div style="display:flex;justify-content:space-between"><b style="color:var(--gold)">MENU PROFISSIONAL</b><button class="btn" onclick="toggleMenu()">✕</button></div>
    <button class="menu-item active" onclick="showView('home')">🏠 INÍCIO LIMPO</button>
    <button class="menu-item" onclick="showView('cifra')">📝 CIFRA</button>
    <button class="menu-item" onclick="showView('vs')">🎚️ VS / BATERIA</button>
    <button class="menu-item" onclick="showView('bpm')">🎛️ BPM / PITCH</button>
    <button class="menu-item gold" onclick="toggleTela(); toggleMenu()">⛶ TELA CHEIA DOMÍNIO TOTAL</button>
    <button class="menu-item" onclick="doInstall()">📲 INSTALAR DIRETO</button>
    <button class="menu-item" onclick="doShare()">📤 COMPARTILHAR APP</button>
  </div>
</div>
<div class="main">
  <div id="view-home" class="view active">
    <div class="card"><b>📁 ADD PLAYBACK / VS</b><label class="file-label" for="fileVS">📁 CLIQUE AQUI PARA PUXAR MP3 / VS</label><input type="file" id="fileVS" accept="audio/*" style="display:none" onchange="loadVS(this)"><div id="vsInfo" style="margin-top:8px;font-size:12px;color:var(--gold)">Nenhum arquivo</div><audio id="audioVS" controls style="width:100%;margin-top:8px"></audio></div>
    <div class="card save"><b style="color:var(--green)">💾 SALVAR MÚSICA VINCULADA</b><input type="text" id="nomeMusica" placeholder="Ex: Meu Caminho - Alto Louvor" style="margin-top:8px"><button class="small green" style="width:100%;padding:12px;margin-top:8px;font-weight:900" onclick="salvarRepertorio()">💾 SALVAR CIFRA + VS + BPM</button><div id="saveStatus" style="margin-top:6px;font-size:11px;color:var(--green)"></div></div>
    <div class="card"><b>📚 MEU REPERTÓRIO</b><div id="listaRepertorio" style="margin-top:8px"></div></div>
    <div class="card"><b>🎵 PREVIEW</b><div id="output" style="margin-top:10px"></div><div style="display:flex;gap:6px;margin-top:10px"><button class="btn gold" onclick="toggleTela()">⛶ TELA CHEIA</button><button class="btn active" id="btnScroll" onclick="toggleScroll()">▶ AUTO SCROLL</button></div></div>
  </div>
  <div id="view-cifra" class="view"><div class="card"><b>📝 COLE CIFRA</b><textarea id="inputCifra" style="height:180px">D5 D E/B
D9 A11/C# G/B
Primeira Parte
D5 D7M(9) D5
MEU CAMINHO E CADA MANHA</textarea><button class="small" style="margin-top:8px;background:var(--gold);color:#000" onclick="renderCifra(); showView('home')">✨ RENDERIZAR</button><label style="font-size:11px;margin-left:8px"><input type="checkbox" id="simplificada" onchange="renderCifra()"> SIMPLIFICADA</label></div></div>
  <div id="view-vs" class="view"><div class="card"><b>🎚️ VS / BATERIA</b><div class="drum-kit"><button class="pad" onclick="playDrum('kick')">BOMBO</button><button class="pad" onclick="playDrum('snare')">CAIXA</button><button class="pad" onclick="playDrum('hihat')">CHIMBAL</button><button class="pad" onclick="playDrum('crash')">PRATO</button><button class="pad" onclick="playDrum('tom1')">TOM 1</button><button class="pad" onclick="playDrum('tom2')">TOM 2</button></div></div></div>
  <div id="view-bpm" class="view"><div class="card"><b>🎛️ BPM & PITCH & GRAVAÇÃO</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="bpm-box"><small>BPM</small><div class="bpm-display" id="bpmDisplay">100</div><input type="range" id="bpmRange" min="40" max="240" value="100" style="width:100%"><div style="display:flex;gap:6px;margin-top:8px"><button class="small" onclick="changeBPM(-5)">-5</button><button class="small" onclick="tapBPM()">TAP</button><button class="small" onclick="changeBPM(5)">+5</button></div></div><div class="bpm-box"><small>PITCH</small><div class="pitch-display" id="pitchDisplay">0</div><input type="range" id="pitchRange" min="-12" max="12" value="0" style="width:100%"><div style="display:flex;gap:6px;margin-top:8px"><button class="small" onclick="changePitch(-1)">-1</button><button class="small" onclick="changePitch(0,true)">0</button><button class="small" onclick="changePitch(1)">+1</button></div></div></div></div></div>
</div>
<div id="telaGrande"><div class="tela-header"><button class="btn" onclick="toggleTela()">✕ FECHAR</button><small style="color:var(--gold)">TELA CHEIA - DOMÍNIO TOTAL</small><div style="display:flex;gap:6px"><button class="small" onclick="changeSize(-1,'letra')">A-</button><button class="small" onclick="changeSize(1,'letra')">A+</button></div></div><div class="tela-content" id="telaGrandeContent"></div></div>
<div class="install-bar"><button id="installBtn" onclick="doInstall()">📲 INSTALAR DIRETO</button><button id="shareBtn" onclick="doShare()">📤 COMPARTILHAR</button></div>
<script>
let letraSize=19,cifraSize=16,vel=1.0,scrolling=false,scrollInt=null,progress=0,audioCtx=null,deferredPrompt=null,bpm=100,pitch=0,recEvents=[],currentAudioBlob=null,currentAudioName='',db=null;
function toggleMenu(){let m=document.getElementById('menuOverlay');m.style.display=m.style.display==='block'?'none':'block';}
function showView(v){document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');toggleMenu();window.scrollTo({top:0,behavior:'smooth'});}
function initDB(){let req=indexedDB.open('taki-vs-v7',1);req.onupgradeneeded=e=>{db=e.target.result;if(!db.objectStoreNames.contains('musicas')){db.createObjectStore('musicas',{keyPath:'id',autoIncrement:true});}};req.onsuccess=e=>{db=e.target.result;carregarRepertorio();};req.onerror=e=>{carregarRepertorioLocal();}}initDB();
function initAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}}
function playDrum(type){initAudio();const now=audioCtx.currentTime;let o=audioCtx.createOscillator();o.frequency.setValueAtTime(type==='kick'?60:800,now);let g=audioCtx.createGain();g.gain.setValueAtTime(0.8,now);g.gain.exponentialRampToValueAtTime(0.01,now+0.3);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+0.3);}
function parseContent(){let raw=document.getElementById('inputCifra').value;let lines=raw.split('\n');let blocks=[];for(let l of lines){if(!l.trim()){blocks.push({type:'space'});continue;}if(/^[A-G]/.test(l.trim())&&!/[áéíóú]/.test(l)){blocks.push({type:'cifra',text:l.trim()});}else{blocks.push({type:'letra',text:l.trim()});}}return blocks;}
function renderCifra(){let blocks=parseContent();let out=document.getElementById('output');out.innerHTML='';blocks.forEach(b=>{if(b.type==='space'){out.innerHTML+='<div style="height:12px"></div>';}else if(b.type==='cifra'){out.innerHTML+=`<div><div class="cifra-line" style="font-size:${cifraSize}px">${b.text}</div></div>`;}else{out.innerHTML+=`<div class="letra-line" style="font-size:${letraSize}px">${b.text.toUpperCase()}</div>`;}});renderTelaGrande();}
function renderTelaGrande(){let blocks=parseContent();let tg=document.getElementById('telaGrandeContent');let h='';blocks.forEach(b=>{if(b.type==='space'){h+='<div style="height:24px"></div>';}else if(b.type==='cifra'){h+=`<div class="tela-cifra" style="font-size:${cifraSize+6}px">${b.text}</div>`;}else{h+=`<div class="tela-letra" style="font-size:${letraSize+11}px">${b.text.toUpperCase()}</div>`;}});tg.innerHTML=h;}
function changeSize(d,tipo){if(tipo==='letra'){letraSize=Math.max(10,Math.min(60,letraSize+d*2));}else{cifraSize=Math.max(8,Math.min(45,cifraSize+d*2));}renderCifra();}
function toggleTela(){let tg=document.getElementById('telaGrande');tg.style.display=tg.style.display==='block'?'none':'block';if(tg.style.display==='block')renderTelaGrande();}
function toggleScroll(){scrolling=!scrolling;let btn=document.getElementById('btnScroll');btn.innerText=scrolling?'⏸ PAUSAR':'▶ AUTO SCROLL';if(scrolling){scrollInt=setInterval(()=>{window.scrollBy(0,vel*1.2);},35);}else{clearInterval(scrollInt);}}
function changeBPM(d){bpm=Math.max(40,Math.min(240,bpm+d));document.getElementById('bpmDisplay').innerText=bpm;}
function tapBPM(){bpm=Math.round(60+Math.random()*40);document.getElementById('bpmDisplay').innerText=bpm;}
function changePitch(d,r){if(r){pitch=0;}else{pitch=Math.max(-12,Math.min(12,pitch+d));}document.getElementById('pitchDisplay').innerText=(pitch>0?'+':'')+pitch;}
function loadVS(input){let file=input.files[0];if(!file)return;currentAudioBlob=file;currentAudioName=file.name;let url=URL.createObjectURL(file);document.getElementById('audioVS').src=url;document.getElementById('vsInfo').innerHTML=`✅ ${file.name}`;}
function salvarRepertorio(){let nome=document.getElementById('nomeMusica').value.trim();if(!nome){alert('Digite nome');return;}let cifra=document.getElementById('inputCifra').value;let musica={nome:nome,cifra:cifra,bpm:bpm,pitch:pitch,recEvents:recEvents,audioName:currentAudioName,data:new Date().toISOString(),temVS:!!currentAudioBlob};if(db&&currentAudioBlob){let tx=db.transaction('musicas','readwrite');let store=tx.objectStore('musicas');musica.audioBlob=currentAudioBlob;store.add(musica).onsuccess=()=>{document.getElementById('saveStatus').innerText=`✅ "${nome}" salvo!`;carregarRepertorio();}}else{let lista=JSON.parse(localStorage.getItem('taki-repertorio-v7')||'[]');let copia={...musica};delete copia.audioBlob;lista.push(copia);localStorage.setItem('taki-repertorio-v7',JSON.stringify(lista));carregarRepertorioLocal();}}
function carregarRepertorio(){if(!db){carregarRepertorioLocal();return;}let tx=db.transaction('musicas','readonly');let req=tx.objectStore('musicas').getAll();req.onsuccess=()=>{renderLista(req.result,JSON.parse(localStorage.getItem('taki-repertorio-v7')||'[]'));};}
function carregarRepertorioLocal(){renderLista([],JSON.parse(localStorage.getItem('taki-repertorio-v7')||'[]'));}
function renderLista(dbLista,localLista){let todas=[...dbLista,...localLista.map((m,i)=>({...m,idLocal:i,isLocal:true}))];let container=document.getElementById('listaRepertorio');if(todas.length===0){container.innerHTML='<div style="color:#888;padding:10px;text-align:center">Nenhuma música</div>';return;}let html='';todas.forEach(m=>{let isLocal=m.isLocal;html+=`<div class="repertorio-item"><div><div class="repertorio-title">${m.nome}</div><div class="repertorio-meta">BPM ${m.bpm} • ${m.audioName||''}</div></div><button class="small green" onclick="tocarMusica(${isLocal?-1:m.id},${isLocal?m.idLocal:-1})">▶ TOCAR</button></div>`;});container.innerHTML=html;}
function tocarMusica(idDB,idLocal){if(idDB!==-1&&db){let tx=db.transaction('musicas','readonly');tx.objectStore('musicas').get(idDB).onsuccess=e=>{let m=e.target.result;document.getElementById('inputCifra').value=m.cifra;if(m.audioBlob){let url=URL.createObjectURL(m.audioBlob);document.getElementById('audioVS').src=url;}renderCifra();};}else{let lista=JSON.parse(localStorage.getItem('taki-repertorio-v7')||'[]');let m=lista[idLocal];document.getElementById('inputCifra').value=m.cifra;renderCifra();}}
function doInstall(){if(deferredPrompt){deferredPrompt.prompt();}else{alert('Chrome: 3 pontinhos > Instalar app');}}
function doShare(){let url=window.location.href;if(navigator.share){navigator.share({title:'TAKI VS v7',text:'Baixa meu app!',url:url});}else{navigator.clipboard.writeText(url);alert('Link copiado: '+url);}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
renderCifra();carregarRepertorio();
</script>
</body>
</html>
